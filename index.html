<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sufyan Ali | Frontend Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Decoration -->
    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>
    <!-- Main Profile -->
    <main class="profile-container">
        <section class="profile-card">
            <!-- Top Badge -->
            <div class="status">
                <span></span>
                Available for Internship
            </div>
            <!-- Profile Image -->
            <div class="profile-image">
                <div class="image-placeholder">
                    SA
                </div>
            </div>
            <!-- Introduction -->
            <div class="profile-content">
                <p class="welcome">HELLO, I'M</p>
                <h1>Sufyan Ali</h1>
                <h2>Frontend Developer</h2>
                <p class="description">
                    BSIT student passionate about creating clean,
                    responsive and user-friendly websites using
                    modern web technologies.
                </p>
                <!-- Skills -->
                <div class="skills">
                    <span>HTML5</span>
                    <span>CSS3</span>
                    <span>Responsive Design</span>
                    <span>UI Design</span>
                </div>
                <!-- Buttons -->
                <div class="buttons">
                    <a href="https://github.com/" target="_blank" class="btn primary">
                      GitHub
                    </a>
                    <a href="https://www.linkedin.com/" target="_blank" class="btn secondary">
                        LinkedIn
                    </a>
                </div>
            </div>
            <!-- Bottom Information -->
            <div class="profile-footer">
                <div>
                    <strong>05+</strong>
                    <small>Projects</small>
                </div>
                <div>
                    <strong>HTML</strong>
                    <small>Learning</small>
                </div>
                <div>
                    <strong>CSS</strong>
                    <small>Learning</small>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
